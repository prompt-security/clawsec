    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />

    <!-- Quicksand: prompt.security brand face -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Quicksand', 'system-ui', 'sans-serif'],
              display: ['Quicksand', 'system-ui', 'sans-serif'],
              mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Consolas', 'monospace'],
            },
            colors: {
              clawd: {
                900: '#05060f', // Deepest ink — code block chrome
                800: '#0b0c1b', // Ink box surface (--ps-purple-dark)
                700: '#232647', // Lifted surface / borders on ink
                600: '#6100ff', // Electric purple (--ps-purple-electric)
                500: '#8f6bff', // Light electric
                accent: '#b56fed', // Brand lavender — highlights on ink
                accentHover: '#c98fff',
                secondary: '#6100ff', // Electric purple on light
                green: '#8fff08', // Acid green (--ps-green) — trace hints only
                greenHover: '#7ee208',
              }
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'float-delayed': 'float 6s ease-in-out 3s infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background: linear-gradient(180deg, #ffffff 0%, #f8f8f8 100%);
        color: #0b0c1b;
      }
      ::selection {
        background: #8fff08;
        color: #0b0c1b;
      }
      :focus-visible {
        outline: 2px solid #6100ff;
        outline-offset: 2px;
        border-radius: 4px;
      }

      /* --- prompt.security background system ---------------------------------
         Reproduced from the brand site's own assets: bg-grid.svg is a uniform
         160x90 grid stroked #C4B6E0 at 20% opacity, and the purple break is the
         Gradient Break Top/Bottom .avif pair, whose per-stop RGBA is sampled
         below so the grid still reads through the translucent ends.
         The brand site hides its grid under 768px; we match that exactly. */
      .ps-grid {
        background-image:
          linear-gradient(to right, rgba(196, 182, 224, 0.2) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(196, 182, 224, 0.2) 1px, transparent 1px);
        /* The brand's grid.svg is 1920 wide with 160x90 cells and scales to the
           viewport, so it is always 12 columns of 16:9 cells at any width. */
        background-size: calc(100vw / 12) calc(100vw / 21.3333);
      }
      @media (max-width: 767px) {
        .ps-grid {
          display: none;
        }
      }
      .ps-wash {
        /* The brand's hero wash is short: pure white by ~8.5% of the viewport
           width down the page, #cdc0eb at the top centre and more saturated at
           the edges. Same ellipse-outside model and t^2 alpha as .ps-break. */
        height: max(110px, 8.46vw);
        background-image: radial-gradient(
          ellipse 137.4% 476% at 50% 390%,
          rgba(83, 37, 186, 0) 60.9%,
          rgba(83, 37, 186, 0.013) 66%,
          rgba(83, 37, 186, 0.05) 71%,
          rgba(83, 37, 186, 0.113) 76%,
          rgba(83, 37, 186, 0.2) 81%,
          rgba(83, 37, 186, 0.29) 85%,
          rgba(83, 37, 186, 0.45) 91%,
          rgba(83, 37, 186, 0.66) 96%,
          rgba(83, 37, 186, 0.85) 100%
        );
      }
      /* White -> #5325ba apex -> white, as two mirrored halves. The brand's
         isolines are elliptical and centred well off the band, so the purple
         climbs ~50px higher at the left and right edges than at the centre.
         Alpha follows t^2 because the source art interpolates from transparent
         WHITE, not from transparent purple. Height puts the apex on the card. */
      .ps-break {
        top: 70px;
        height: 1254px;
        background-image:
          radial-gradient(
            ellipse 160% 150.74% at 50% -51.14%,
            rgba(83, 37, 186, 0) 56.87%,
            rgba(83, 37, 186, 0.023) 63.34%,
            rgba(83, 37, 186, 0.09) 69.81%,
            rgba(83, 37, 186, 0.203) 76.28%,
            rgba(83, 37, 186, 0.36) 82.75%,
            rgba(83, 37, 186, 0.563) 89.22%,
            rgba(83, 37, 186, 0.81) 95.69%,
            rgba(83, 37, 186, 1) 98%,
            rgba(83, 37, 186, 1) 100%
          ),
          radial-gradient(
            ellipse 160% 150.74% at 50% 151.14%,
            rgba(83, 37, 186, 0) 56.87%,
            rgba(83, 37, 186, 0.023) 63.34%,
            rgba(83, 37, 186, 0.09) 69.81%,
            rgba(83, 37, 186, 0.203) 76.28%,
            rgba(83, 37, 186, 0.36) 82.75%,
            rgba(83, 37, 186, 0.563) 89.22%,
            rgba(83, 37, 186, 0.81) 95.69%,
            rgba(83, 37, 186, 1) 98%,
            rgba(83, 37, 186, 1) 100%
          );
        /* +1px so the two halves overlap and leave no hairline at the seam */
        background-size: 100% calc(50% + 1px);
        background-position: top, bottom;
        background-repeat: no-repeat;
      }
      @media (max-width: 767px) {
        .ps-break {
          height: 1700px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #d9d7e4;
        border-radius: 6px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #8fff08;
      }
      /* Mobile overflow fixes */
      html, body {
        overflow-x: hidden;
        width: 100%;
        max-width: 100vw;
      }
      #root {
        overflow-x: hidden;
        width: 100%;
        max-width: 100vw;
      }
      /* Ensure code blocks wrap properly */
      code, pre {
        word-break: break-word;
        overflow-wrap: break-word;
      }
      /* Fix for tables on mobile */
      table {
        display: block;
        overflow-x: auto;
        max-width: 100%;
      }
    </style>
