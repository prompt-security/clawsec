name: i18n QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'README*.md'
      - 'wiki/**/*.md'
      - 'scripts/i18n/**'
      - '.github/workflows/i18n-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  i18n-qa:
    name: Translation Integrity Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.15'
      - name: Run i18n QA
        run: python scripts/i18n/qa_check.py

      - name: Check markdown links (README/wiki)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/i18n/link_check.py --changed-only --base-ref "origin/${GITHUB_BASE_REF}"
          else
            python scripts/i18n/link_check.py
          fi
