name: Poll NVD CVEs

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force_full_scan:
        description: 'Ignore feed state and rebuild CVE advisories from full NVD history'
        required: false
        default: 'false'
        type: boolean
      allow_large_rebuild_drop:
        description: 'Allow a reviewed material full-rebuild drop or incremental retraction set'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

concurrency:
  group: poll-nvd-cves
  cancel-in-progress: false

env:
  FEED_PATH: advisories/feed.json
  FEED_SIG_PATH: advisories/feed.json.sig
  GHSA_FEED_PATH: advisories/ghsa-without-cve.json
  GHSA_FEED_SIG_PATH: advisories/ghsa-without-cve.json.sig
  SKILL_FEED_PATH: skills/clawsec-feed/advisories/feed.json
  SKILL_FEED_SIG_PATH: skills/clawsec-feed/advisories/feed.json.sig
  SUITE_FEED_PATH: skills/clawsec-suite/advisories/feed.json
  SUITE_FEED_SIG_PATH: skills/clawsec-suite/advisories/feed.json.sig

jobs:
  poll-and-update:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python for exploitability analysis
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set safe NVD overlap window
        id: last_poll
        run: |
          # The consolidated feed timestamp also advances for community and
          # GHSA-only changes, so it is not a valid NVD cursor. Re-read the
          # maximum NVD modification window on every incremental run. NVD
          # records are deduplicated by CVE ID later in the job.
          # Stay below NVD's 120-day maximum even though this timestamp and the
          # end timestamp are captured in separate workflow steps.
          LAST_UPDATED=$(date -u -d '119 days ago' +%Y-%m-%dT%H:%M:%S.000Z 2>/dev/null || date -u -v-119d +%Y-%m-%dT%H:%M:%S.000Z)
          echo "last_date=$LAST_UPDATED" >> "$GITHUB_OUTPUT"
          echo "Using rolling NVD overlap start: $LAST_UPDATED"

      - name: Set date window
        id: dates
        env:
          STEPS_LAST_POLL_OUTPUTS_LAST_DATE: ${{ steps.last_poll.outputs.last_date }}
        run: |
          START_DATE="${STEPS_LAST_POLL_OUTPUTS_LAST_DATE}"
          END_DATE=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          
          # Convert to epoch for comparison
          START_EPOCH=$(date -d "$START_DATE" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%S" "${START_DATE%.*}" +%s)
          END_EPOCH=$(date -d "$END_DATE" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%S" "${END_DATE%.*}" +%s)
          
          # Ensure start date is before end date (NVD returns 404 if start > end)
          if [ "$START_EPOCH" -ge "$END_EPOCH" ]; then
            echo "Warning: Start date ($START_DATE) is not before end date ($END_DATE)"
            echo "Adjusting start date to 24 hours before end date"
            START_EPOCH=$((END_EPOCH - 86400))
            START_DATE=$(date -u -d "@$START_EPOCH" +%Y-%m-%dT%H:%M:%S.000Z 2>/dev/null || date -u -r "$START_EPOCH" +%Y-%m-%dT%H:%M:%S.000Z)
          fi
          
          echo "start_date=$START_DATE" >> $GITHUB_OUTPUT
          echo "end_date=$END_DATE" >> $GITHUB_OUTPUT
          echo "Polling window: $START_DATE to $END_DATE"

      - name: Fetch CVEs from NVD
        id: fetch
        env:
          STEPS_DATES_OUTPUTS_START_DATE: ${{ steps.dates.outputs.start_date }}
          STEPS_DATES_OUTPUTS_END_DATE: ${{ steps.dates.outputs.end_date }}
        run: |
          set -euo pipefail
          source scripts/feed-utils.sh
          mkdir -p tmp
          FORCE_FULL_SCAN="${{ inputs.force_full_scan }}"
          NVD_QUERY_SPECS="$(nvd_query_specs_for_scan "$FORCE_FULL_SCAN")"
          
          START_DATE="${STEPS_DATES_OUTPUTS_START_DATE}"
          END_DATE="${STEPS_DATES_OUTPUTS_END_DATE}"
          
          # URL encode the dates
          START_ENC=$(echo "$START_DATE" | sed 's/:/%3A/g')
          END_ENC=$(echo "$END_DATE" | sed 's/:/%3A/g')
          
          echo "=== Fetching CVEs from NVD ==="

          FAILED_QUERIES=()
          
          while IFS='|' read -r QUERY_KIND QUERY_VALUE; do
            [ -n "$QUERY_KIND" ] || continue

            QUERY_SLUG="$(nvd_query_slug "$QUERY_KIND" "$QUERY_VALUE")"
            echo "Fetching $QUERY_KIND query: $QUERY_VALUE"

            keyword_ok=false
            last_http_code=""
            echo '{"vulnerabilities":[]}' > "tmp/nvd_${QUERY_SLUG}.json"
            START_INDEX=0
            RESULTS_PER_PAGE=2000
            EXPECTED_TOTAL=-1

            if [ "$FORCE_FULL_SCAN" = "true" ]; then
              echo "Full scan mode enabled: paginating complete NVD history for '$QUERY_KIND:$QUERY_VALUE'"
            else
              echo "Incremental mode: paginating the broad rolling NVD modification inventory"
            fi

            while true; do
              if [ "$FORCE_FULL_SCAN" = "true" ]; then
                QUERY_SUFFIX="&startIndex=${START_INDEX}&resultsPerPage=${RESULTS_PER_PAGE}"
              else
                QUERY_SUFFIX="&lastModStartDate=${START_ENC}&lastModEndDate=${END_ENC}&startIndex=${START_INDEX}&resultsPerPage=${RESULTS_PER_PAGE}"
              fi
              URL="$(nvd_build_url "$QUERY_KIND" "$QUERY_VALUE" "$QUERY_SUFFIX")"
              PAGE_FILE="tmp/nvd_${QUERY_SLUG}_${START_INDEX}.json"
              echo "URL: $URL"

              page_ok=false
              for i in 1 2 3; do
                HTTP_CODE=$(curl -sS -w "%{http_code}" -o "$PAGE_FILE" "$URL" || true)
                if [ -z "$HTTP_CODE" ]; then
                  HTTP_CODE="000"
                fi
                last_http_code="$HTTP_CODE"
                if [ "$HTTP_CODE" = "200" ]; then
                  if jq -e '
                    (.vulnerabilities | type == "array") and
                    (.totalResults | type == "number" and . >= 0 and . == floor) and
                    (.startIndex | type == "number" and . >= 0 and . == floor) and
                    (.resultsPerPage | type == "number" and . >= 0 and . == floor) and
                    ([.vulnerabilities[]? | .cve.id | type == "string"] | all)
                  ' "$PAGE_FILE" >/dev/null 2>&1; then
                    page_ok=true
                    break
                  fi
                  echo "Invalid or incomplete NVD JSON for $QUERY_KIND:$QUERY_VALUE page $START_INDEX, retry $i..."
                  sleep 5
                elif [ "$HTTP_CODE" = "403" ] || [ "$HTTP_CODE" = "429" ]; then
                  echo "Rate limited, waiting 30s before retry $i..."
                  sleep 30
                else
                  echo "HTTP $HTTP_CODE for $QUERY_KIND:$QUERY_VALUE, retry $i..."
                  sleep 5
                fi
              done

              if [ "$page_ok" != "true" ]; then
                break
              fi

              RESPONSE_START=$(jq -r '.startIndex' "$PAGE_FILE")
              PAGE_COUNT=$(jq '.vulnerabilities | length' "$PAGE_FILE")
              TOTAL_RESULTS=$(jq '.totalResults' "$PAGE_FILE")
              if [ "$RESPONSE_START" -ne "$START_INDEX" ]; then
                echo "::error::NVD startIndex mismatch for '$QUERY_KIND:$QUERY_VALUE': requested $START_INDEX, received $RESPONSE_START"
                break
              fi
              if [ "$EXPECTED_TOTAL" -eq -1 ]; then
                EXPECTED_TOTAL="$TOTAL_RESULTS"
              elif [ "$TOTAL_RESULTS" -ne "$EXPECTED_TOTAL" ]; then
                echo "::error::NVD totalResults changed during pagination for '$QUERY_KIND:$QUERY_VALUE': $EXPECTED_TOTAL to $TOTAL_RESULTS"
                break
              fi
              if [ "$PAGE_COUNT" -eq 0 ] && [ "$START_INDEX" -lt "$EXPECTED_TOTAL" ]; then
                echo "::error::NVD returned an empty page before all results for '$QUERY_KIND:$QUERY_VALUE'"
                break
              fi

              jq -s '.[0].vulnerabilities += .[1].vulnerabilities | .[0]' \
                "tmp/nvd_${QUERY_SLUG}.json" "$PAGE_FILE" > "tmp/nvd_${QUERY_SLUG}_merged.json"
              mv "tmp/nvd_${QUERY_SLUG}_merged.json" "tmp/nvd_${QUERY_SLUG}.json"

              MERGED_COUNT=$(jq '.vulnerabilities | length' "tmp/nvd_${QUERY_SLUG}.json")
              UNIQUE_MERGED_COUNT=$(jq '[.vulnerabilities[].cve.id] | unique | length' "tmp/nvd_${QUERY_SLUG}.json")
              echo "Fetched $PAGE_COUNT results at startIndex=$START_INDEX ($MERGED_COUNT/$EXPECTED_TOTAL complete)"
              if [ "$UNIQUE_MERGED_COUNT" -ne "$MERGED_COUNT" ]; then
                echo "::error::NVD returned duplicate CVE IDs while paginating '$QUERY_KIND:$QUERY_VALUE'"
                break
              fi
              if [ "$MERGED_COUNT" -eq "$EXPECTED_TOTAL" ]; then
                keyword_ok=true
                break
              fi
              if [ "$MERGED_COUNT" -gt "$EXPECTED_TOTAL" ]; then
                echo "::error::NVD returned more rows than totalResults for '$QUERY_KIND:$QUERY_VALUE'"
                break
              fi

              START_INDEX=$((START_INDEX + PAGE_COUNT))
              # NVD recommends 6 second delay between requests
              sleep 6
            done

            if [ "$keyword_ok" != "true" ]; then
              echo "::error::Failed to fetch valid NVD response for '$QUERY_KIND:$QUERY_VALUE' (last HTTP code: ${last_http_code:-unknown})."
              FAILED_QUERIES+=("${QUERY_KIND}:${QUERY_VALUE}")
            fi
            
            # NVD recommends 6 second delay between requests
            sleep 6
          done <<< "$NVD_QUERY_SPECS"
          
          if [ "${#FAILED_QUERIES[@]}" -gt 0 ]; then
            echo "::error::NVD fetch failed for query spec(s): ${FAILED_QUERIES[*]}"
            exit 1
          fi

          echo "=== Fetch complete ==="
          ls -la tmp/

      - name: Merge and filter CVEs
        id: process
        run: |
          set -euo pipefail
          source scripts/feed-utils.sh
          FORCE_FULL_SCAN="${{ inputs.force_full_scan }}"
          NVD_QUERY_SPECS="$(nvd_query_specs_for_scan "$FORCE_FULL_SCAN")"
          # Export the protected component set for PR body + workflow summary steps.
          PROTECTED_COMPONENTS="$(nvd_summary_components)"
          echo "PROTECTED_COMPONENTS=$PROTECTED_COMPONENTS" >> "$GITHUB_ENV"

          # Combine all fetched CVEs
          echo '{"vulnerabilities":[]}' > tmp/combined.json
          
          while IFS='|' read -r QUERY_KIND QUERY_VALUE; do
            [ -n "$QUERY_KIND" ] || continue
            QUERY_SLUG="$(nvd_query_slug "$QUERY_KIND" "$QUERY_VALUE")"
            FILE="tmp/nvd_${QUERY_SLUG}.json"
            if [ -f "$FILE" ] && [ -s "$FILE" ]; then
              # Check if file has vulnerabilities array
              if jq -e '.vulnerabilities' "$FILE" > /dev/null 2>&1; then
                COUNT=$(jq '.vulnerabilities | length' "$FILE")
                echo "Found $COUNT CVEs for NVD query '$QUERY_KIND:$QUERY_VALUE'"
                
                # Merge into combined
                jq -s '.[0].vulnerabilities += .[1].vulnerabilities | .[0]' \
                  tmp/combined.json "$FILE" > tmp/combined_new.json
                mv tmp/combined_new.json tmp/combined.json
              fi
            fi
          done <<< "$NVD_QUERY_SPECS"
          
          # Exact duplicates are expected across overlapping discovery queries.
          # Different snapshots for one ID mean NVD changed mid-scan; fail rather
          # than choosing an arbitrary stale or pre-rejection record.
          nvd_assert_no_conflicting_duplicates tmp/combined.json

          # Deduplicate identical CVE payloads by ID.
          jq '.vulnerabilities | unique_by(.cve.id)' tmp/combined.json > tmp/unique_cves.json
          TOTAL=$(jq 'length' tmp/unique_cves.json)
          echo "Total unique CVEs from NVD: $TOTAL"

          # Rejected identifiers must survive the transform boundary long enough
          # to remove any existing canonical CVE. A provisional GHSA remains
          # publishable under its own identity.
          jq -L scripts '
            include "nvd-advisory-transform";
            [.[] | select(is_rejected) | .cve.id] | unique | sort
          ' tmp/unique_cves.json > tmp/fetched_rejected_cve_ids.json
          
          # Discovery queries are broad. Publication requires an allowlisted
          # product CPE and an explicit machine-readable affected version scope.
          jq -L scripts '
            include "nvd-advisory-transform";
            [.[] | select(has_supported_scoped_target)]
          ' tmp/unique_cves.json > tmp/filtered_cves.json
          
          FILTERED=$(jq 'length' tmp/filtered_cves.json)
          echo "Filtered CVEs (matching criteria): $FILTERED"
          echo "filtered_count=$FILTERED" >> $GITHUB_OUTPUT
          echo "nvd_filtered_count=$FILTERED" >> $GITHUB_OUTPUT

          # A complete rebuild with no publishable NVD record is indistinguishable
          # from a bad/empty upstream snapshot. Never use it to erase the existing
          # CVE set. Incremental windows may legitimately contain zero matches.
          if [ "${{ inputs.force_full_scan }}" = "true" ] && [ "$FILTERED" -eq 0 ]; then
            echo "::error::Refusing full rebuild: strict NVD scoping produced zero advisories."
            exit 1
          fi

      - name: Get existing advisories
        id: existing
        run: |
          set -euo pipefail
          FORCE_FULL_SCAN="${{ inputs.force_full_scan }}"
          if [ -f "$FEED_PATH" ]; then
            if ! jq -e 'type == "object" and (.advisories | type == "array" and length > 0)' "$FEED_PATH" >/dev/null; then
              echo "::error::Existing advisory feed is malformed or empty: $FEED_PATH"
              exit 1
            fi
            jq -r '.advisories[]?.id // empty' "$FEED_PATH" | sort -u > tmp/existing_ids.txt
            # Also extract full existing advisories for update comparison
            jq '.advisories // []' "$FEED_PATH" > tmp/existing_advisories.json
          else
            if [ "$FORCE_FULL_SCAN" != "true" ]; then
              echo "::error::Canonical advisory feed is missing. Incremental generation cannot safely reconstruct history; rerun with force_full_scan=true only for an intentional bootstrap."
              exit 1
            fi
            echo "Explicit full-scan bootstrap: no existing canonical feed found."
            touch tmp/existing_ids.txt
            echo '[]' > tmp/existing_advisories.json
          fi

          # Only existing canonical CVEs need explicit rejection state. A GHSA
          # with no NVD-backed canonical record remains under its GHSA identity,
          # so the signed feed never accumulates a global rejection inventory.
          jq -n \
            --slurpfile existing tmp/existing_advisories.json \
            --slurpfile rejected tmp/fetched_rejected_cve_ids.json '
            ($existing[0]
              | map(select((.id // "") | startswith("CVE-")))
              | map(.id)
              | unique
            ) as $existing_cve_ids |
            [
              $rejected[0][] |
              select(. as $id | ($existing_cve_ids | index($id)) != null)
            ] | unique | sort
          ' > tmp/rejected_cve_ids.json

          EXISTING_COUNT=$(wc -l < tmp/existing_ids.txt | tr -d ' ')
          echo "Existing advisories: $EXISTING_COUNT"
          cat tmp/existing_ids.txt

      - name: Check for updates to existing advisories
        id: updates
        run: |
          set -euo pipefail
          source scripts/feed-utils.sh

          if [ "${{ inputs.force_full_scan }}" = "true" ]; then
            echo "Full scan mode enabled: skipping delta update detection."
            echo '[]' > tmp/updated_advisories.json
            echo '[]' > tmp/retracted_advisory_ids.json
            echo "Advisories to update: 0"
            echo "update_count=0" >> $GITHUB_OUTPUT
            echo "nvd_updated_count=0" >> $GITHUB_OUTPUT
            echo "retracted_count=0" >> $GITHUB_OUTPUT
            echo "nvd_retracted_count=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Compare existing CVE advisories against NVD data for changes
          # Only check advisories that start with "CVE-" (NVD-sourced)

          jq -L scripts '
            include "nvd-advisory-transform";
            [.[] | nvd_advisory_current_state]
          ' tmp/filtered_cves.json > tmp/nvd_current_state.json

          # Find updates: existing CVE advisories where NVD data differs
          jq -n --slurpfile existing tmp/existing_advisories.json --slurpfile nvd tmp/nvd_current_state.json '
            # Get only CVE-prefixed existing advisories
            ($existing[0] | map(select(.id | startswith("CVE-")))) as $cve_advisories |

            # For each NVD entry, check if it exists and has changes
            [
              $nvd[0][] |
              . as $nvd_entry |
              ($cve_advisories | map(select(.id == $nvd_entry.id)) | first) as $existing_entry |
              if $existing_entry then
                # Compare key fields
                if ($existing_entry.severity != $nvd_entry.severity) or
                   ($existing_entry.type != $nvd_entry.type) or
                   ($existing_entry.nvd_category_id != $nvd_entry.nvd_category_id) or
                   ($existing_entry.cvss_score != $nvd_entry.cvss_score) or
                   ($existing_entry.cvss_vector != $nvd_entry.cvss_vector) or
                   ($existing_entry.published != $nvd_entry.published) or
                   ($existing_entry.updated != $nvd_entry.updated) or
                   ($existing_entry.authoritative_nvd_affected != $nvd_entry.authoritative_nvd_affected) or
                   ($existing_entry.synthesized_from_ghsa != $nvd_entry.synthesized_from_ghsa) or
                   ($existing_entry.authoritative_canonical_platforms != $nvd_entry.authoritative_canonical_platforms) or
                   ($existing_entry.authoritative_canonical_cwe_ids != $nvd_entry.authoritative_canonical_cwe_ids) or
                   ($existing_entry.description != $nvd_entry.description) or
                   ($existing_entry.title != $nvd_entry.title) or
                   ($existing_entry.references != $nvd_entry.references) then
                  {
                    id: $nvd_entry.id,
                    changes: (
                      []
                      + (if $existing_entry.severity != $nvd_entry.severity then ["severity: \($existing_entry.severity) → \($nvd_entry.severity)"] else [] end)
                      + (if $existing_entry.type != $nvd_entry.type then ["type: \($existing_entry.type // "null") → \($nvd_entry.type // "null")"] else [] end)
                      + (if $existing_entry.nvd_category_id != $nvd_entry.nvd_category_id then ["nvd_category_id: \($existing_entry.nvd_category_id // "null") → \($nvd_entry.nvd_category_id // "null")"] else [] end)
                      + (if $existing_entry.cvss_score != $nvd_entry.cvss_score then ["cvss_score: \($existing_entry.cvss_score // "null") → \($nvd_entry.cvss_score // "null")"] else [] end)
                      + (if $existing_entry.cvss_vector != $nvd_entry.cvss_vector then ["CVSS vector updated"] else [] end)
                      + (if $existing_entry.published != $nvd_entry.published then ["NVD publication timestamp updated"] else [] end)
                      + (if $existing_entry.updated != $nvd_entry.updated then ["NVD last-modified timestamp updated"] else [] end)
                      + (if $existing_entry.authoritative_nvd_affected != $nvd_entry.authoritative_nvd_affected then ["NVD affected targets updated"] else [] end)
                      + (if $existing_entry.synthesized_from_ghsa != $nvd_entry.synthesized_from_ghsa then ["NVD scope provenance established"] else [] end)
                      + (if $existing_entry.authoritative_canonical_platforms != $nvd_entry.authoritative_canonical_platforms then ["NVD platforms updated"] else [] end)
                      + (if $existing_entry.authoritative_canonical_cwe_ids != $nvd_entry.authoritative_canonical_cwe_ids then ["NVD CWE identifiers updated"] else [] end)
                      + (if $existing_entry.description != $nvd_entry.description then ["description updated"] else [] end)
                      + (if $existing_entry.title != $nvd_entry.title then ["title updated"] else [] end)
                      + (if $existing_entry.references != $nvd_entry.references then ["references updated"] else [] end)
                    ),
                    updated_fields: {
                      severity: $nvd_entry.severity,
                      type: $nvd_entry.type,
                      nvd_category_id: $nvd_entry.nvd_category_id,
                      cvss_score: $nvd_entry.cvss_score,
                      cvss_vector: $nvd_entry.cvss_vector,
                      published: $nvd_entry.published,
                      updated: $nvd_entry.updated,
                      affected: $nvd_entry.affected,
                      authoritative_nvd_affected: $nvd_entry.authoritative_nvd_affected,
                      synthesized_from_ghsa: $nvd_entry.synthesized_from_ghsa,
                      platforms: $nvd_entry.platforms,
                      authoritative_canonical_platforms: $nvd_entry.authoritative_canonical_platforms,
                      cwe_ids: $nvd_entry.cwe_ids,
                      authoritative_canonical_cwe_ids: $nvd_entry.authoritative_canonical_cwe_ids,
                      description: $nvd_entry.description,
                      title: $nvd_entry.title,
                      references: $nvd_entry.references
                    }
                  }
                else
                  empty
                end
              else
                empty
              end
            ]
          ' > tmp/updated_advisories.json

          # If NVD returned an existing CVE in the overlap window but its
          # current record no longer has an allowlisted product+version scope,
          # stop publishing that stale record. GHSA consolidation may restore
          # it later in the job when authoritative GHSA scope still exists.
          jq -n \
            --slurpfile existing tmp/existing_advisories.json \
            --slurpfile fetched tmp/unique_cves.json \
            --slurpfile scoped tmp/filtered_cves.json '
            ($fetched[0] | map(.cve.id) | unique) as $fetched_ids |
            ($scoped[0] | map(.cve.id) | unique) as $scoped_ids |
            [
              $existing[0][] |
              select((.id // "") | startswith("CVE-")) |
              .id as $id |
              select(($fetched_ids | index($id)) != null) |
              select(($scoped_ids | index($id)) == null) |
              $id
            ] | unique
          ' > tmp/retracted_advisory_ids.json

          node scripts/ci/repair_stale_exploitability.mjs \
            --feed "$FEED_PATH" \
            --updates tmp/updated_advisories.json \
            --output tmp/updated_advisories.json \
            --nvd-json tmp/filtered_cves.json

          UPDATE_COUNT=$(jq 'length' tmp/updated_advisories.json)
          RETRACTED_COUNT=$(jq 'length' tmp/retracted_advisory_ids.json)
          EXISTING_CVE_COUNT=$(jq '[.[] | select((.id // "") | startswith("CVE-"))] | length' tmp/existing_advisories.json)
          echo "Advisories to update: $UPDATE_COUNT"
          echo "Advisories no longer carrying publishable NVD scope: $RETRACTED_COUNT"
          RETRACTION_LIMIT="$(nvd_drop_review_limit)"
          echo "Incremental retraction safety check: $RETRACTED_COUNT of $EXISTING_CVE_COUNT existing CVEs (review at $RETRACTION_LIMIT records or 25% of the current CVE feed)"
          if nvd_is_material_drop "$RETRACTED_COUNT" "$EXISTING_CVE_COUNT" && [ "${{ inputs.allow_large_rebuild_drop }}" != "true" ]; then
            echo "::error::Refusing incremental update: $RETRACTED_COUNT of $EXISTING_CVE_COUNT existing CVEs would be retracted (review threshold: $RETRACTION_LIMIT records or 25% of the current CVE feed). Review the broad NVD inventory, then rerun with allow_large_rebuild_drop=true if intentional."
            exit 1
          fi
          echo "update_count=$UPDATE_COUNT" >> $GITHUB_OUTPUT
          echo "nvd_updated_count=$UPDATE_COUNT" >> $GITHUB_OUTPUT
          echo "retracted_count=$RETRACTED_COUNT" >> $GITHUB_OUTPUT
          echo "nvd_retracted_count=$RETRACTED_COUNT" >> $GITHUB_OUTPUT

          if [ "$UPDATE_COUNT" -gt 0 ]; then
            echo "=== Updated advisories ==="
            jq -r '.[] | "- \(.id): \(.changes | join(", "))"' tmp/updated_advisories.json
          fi

          if [ "$RETRACTED_COUNT" -gt 0 ]; then
            echo "=== Retracted advisories ==="
            jq -r '.[] | "- \(.)"' tmp/retracted_advisory_ids.json
          fi

      - name: Transform CVEs to advisories
        id: transform
        env:
          STEPS_PROCESS_OUTPUTS_FILTERED_COUNT: ${{ steps.process.outputs.filtered_count }}
        run: |
          set -euo pipefail
          source scripts/feed-utils.sh

          # Read existing IDs into jq-friendly files (avoids huge CLI args on full scans).
          jq -R -s 'split("\n") | map(select(length > 0))' < tmp/existing_ids.txt > tmp/existing_ids_from_feed.json

          if [ "${{ inputs.force_full_scan }}" = "true" ]; then
            echo "Full scan mode enabled: rebuilding CVE advisories from scratch."
            echo '[]' > tmp/existing_ids.json
          else
            cp tmp/existing_ids_from_feed.json tmp/existing_ids.json
          fi
          
          # Transform NVD CVEs to our advisory format
          jq -L scripts --slurpfile existing tmp/existing_ids.json '
            include "nvd-advisory-transform";
            [.[] |
              select(.cve.id as $id | (($existing[0] // []) | index($id) | not)) |
              nvd_advisory
            ]
          ' tmp/filtered_cves.json > tmp/new_advisories.json
          
          NEW_COUNT=$(jq 'length' tmp/new_advisories.json)
          jq --slurpfile existing tmp/existing_ids_from_feed.json '
            [.[] | select(.id as $id | (($existing[0] // []) | index($id) | not))]
          ' tmp/new_advisories.json > tmp/net_new_advisories.json

          NET_NEW_COUNT=$(jq 'length' tmp/net_new_advisories.json)
          if [ "${{ inputs.force_full_scan }}" = "true" ]; then
            REBUILT_COUNT="$NEW_COUNT"
          else
            REBUILT_COUNT=0
          fi

          echo "Transformed NVD advisories: $NEW_COUNT"
          echo "NVD advisories rebuilt: $REBUILT_COUNT"
          echo "Net-new NVD advisories to add: $NET_NEW_COUNT"
          echo "new_count=$NEW_COUNT" >> $GITHUB_OUTPUT
          echo "nvd_rebuilt_count=$REBUILT_COUNT" >> $GITHUB_OUTPUT
          echo "nvd_new_to_feed_count=$NET_NEW_COUNT" >> $GITHUB_OUTPUT

          if [ "${{ inputs.force_full_scan }}" = "true" ]; then
            FILTERED_COUNT="${STEPS_PROCESS_OUTPUTS_FILTERED_COUNT}"
            if [ "$NEW_COUNT" -ne "$FILTERED_COUNT" ]; then
              echo "::error::Full scan transform mismatch: filtered CVEs=$FILTERED_COUNT transformed advisories=$NEW_COUNT"
              exit 1
            fi

            jq -n --slurpfile existing tmp/existing_advisories.json --slurpfile rebuilt tmp/new_advisories.json '
              ($rebuilt[0] | map(.id) | unique) as $rebuilt_ids |
              [
                $existing[0][] |
                select((.id // "") | startswith("CVE-")) |
                .id as $id |
                select(($rebuilt_ids | index($id)) == null) |
                $id
              ] | unique
            ' > tmp/full_rebuild_removed_ids.json
            EXISTING_CVE_COUNT=$(jq '[.[] | select((.id // "") | startswith("CVE-"))] | length' tmp/existing_advisories.json)
            FULL_REBUILD_REMOVED_COUNT=$(jq 'length' tmp/full_rebuild_removed_ids.json)
            DROP_REVIEW_LIMIT="$(nvd_drop_review_limit)"
            echo "Full rebuild identity safety check: $FULL_REBUILD_REMOVED_COUNT of $EXISTING_CVE_COUNT existing CVE IDs absent (review at $DROP_REVIEW_LIMIT records or 25% of the current CVE feed)"
            if nvd_is_material_drop "$FULL_REBUILD_REMOVED_COUNT" "$EXISTING_CVE_COUNT" && [ "${{ inputs.allow_large_rebuild_drop }}" != "true" ]; then
              echo "::error::Refusing full rebuild: $FULL_REBUILD_REMOVED_COUNT of $EXISTING_CVE_COUNT existing CVE IDs would be removed (review threshold: $DROP_REVIEW_LIMIT records or 25% of the current CVE feed). Review counts and IDs, then rerun with allow_large_rebuild_drop=true if intentional."
              jq -r '.[] | "- \(.)"' tmp/full_rebuild_removed_ids.json
              exit 1
            fi
          fi
          
          if [ "$NET_NEW_COUNT" -gt 0 ]; then
            echo "=== Net-new NVD advisories ==="
            jq '.[].id' tmp/net_new_advisories.json
          fi

      - name: Analyze exploitability for new advisories
        if: steps.transform.outputs.new_count != '0'
        run: |
          set -euo pipefail

          echo "=== Analyzing exploitability for new advisories ==="

          # Extract CVSS vectors from filtered CVEs to merge with advisories
          jq '
            [.[] | {
              id: .cve.id,
              cvss_vector: (
                .cve.metrics.cvssMetricV40[0]?.cvssData.vectorString //
                .cve.metrics.cvssMetricV31[0]?.cvssData.vectorString //
                .cve.metrics.cvssMetricV30[0]?.cvssData.vectorString //
                .cve.metrics.cvssMetricV2[0]?.cvssData.vectorString //
                .cve.metrics.cvssMetricV2[0]?.vectorString //
                ""
              )
            }] | map({(.id): .cvss_vector}) | add
          ' tmp/filtered_cves.json > tmp/cvss_vectors.json

          scripts/ci/enrich_exploitability.sh \
            --mode batch \
            --input tmp/new_advisories.json \
            --output tmp/new_advisories.json \
            --cvss-vectors tmp/cvss_vectors.json

          echo "=== Exploitability analysis complete ==="

          # Show summary of exploitability scores
          echo "Exploitability score distribution:"
          jq -r '.[] | "\(.id): \(.exploitability_score // "unknown")"' tmp/new_advisories.json | \
            awk -F': ' '{scores[$2]++} END {for (s in scores) print "  " s ": " scores[s]}'

      - name: Finalize NVD update counts
        id: nvd_counts
        run: |
          set -euo pipefail

          if [ "${{ inputs.force_full_scan }}" = "true" ]; then
            jq -n --slurpfile existing tmp/existing_advisories.json --slurpfile rebuilt tmp/new_advisories.json '
              ($existing[0]
                | map(select((.id // "") | startswith("CVE-")))
                | map({key: .id, value: .})
                | from_entries
              ) as $existing_by_id |
              [
                $rebuilt[0][] |
                . as $rebuilt_entry |
                ($existing_by_id[$rebuilt_entry.id] // null) as $existing_entry |
                select($existing_entry != null and $existing_entry != $rebuilt_entry) |
                {
                  id: $rebuilt_entry.id,
                  changes: ["rebuilt advisory differs from existing feed"],
                  updated_fields: $rebuilt_entry
                }
              ]
            ' > tmp/updated_advisories.json
          fi

          UPDATE_COUNT=$(jq 'length' tmp/updated_advisories.json)
          echo "Final NVD advisories to update: $UPDATE_COUNT"
          echo "update_count=$UPDATE_COUNT" >> "$GITHUB_OUTPUT"
          echo "nvd_updated_count=$UPDATE_COUNT" >> "$GITHUB_OUTPUT"

      - name: Update feed.json
        if: inputs.force_full_scan == true || steps.transform.outputs.new_count != '0' || steps.nvd_counts.outputs.update_count != '0' || steps.updates.outputs.retracted_count != '0'
        run: |
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          FORCE_FULL_SCAN="${{ inputs.force_full_scan }}"

          if [ -f "$FEED_PATH" ] && [ "$FORCE_FULL_SCAN" = "true" ]; then
            # Full scan mode: replace all CVE advisories with rebuilt set and keep non-CVE entries.
            jq --slurpfile rebuilt tmp/new_advisories.json --arg now "$NOW" '
              .updated = $now |
              .advisories = (
                ((.advisories // []) | map(select((.id // "") | startswith("CVE-") | not)))
                + ($rebuilt[0] // [])
                | sort_by(.published)
                | reverse
              )
            ' "$FEED_PATH" > tmp/updated_feed.json
          elif [ -f "$FEED_PATH" ]; then
            # Step 1: Apply updates to existing advisories
            jq --slurpfile updates tmp/updated_advisories.json --slurpfile retracted tmp/retracted_advisory_ids.json '
              .advisories = [
                .advisories[] |
                . as $adv |
                select(($adv.id as $id | (($retracted[0] // []) | index($id))) == null) |
                ($updates[0] | map(select(.id == $adv.id)) | first) as $update |
                if $update then
                  # Merge updated fields
                  ($adv * $update.updated_fields)
                else
                  $adv
                end
              ]
            ' "$FEED_PATH" > tmp/feed_with_updates.json

            # Step 2: Add new advisories
            jq --slurpfile new tmp/new_advisories.json --arg now "$NOW" '
              .updated = $now |
              .advisories = (.advisories + ($new[0] // []) | sort_by(.published) | reverse)
            ' tmp/feed_with_updates.json > tmp/updated_feed.json
          else
            jq -n --slurpfile advisories tmp/new_advisories.json --arg now "$NOW" '{
              version: "1.0.0",
              updated: $now,
              description: "Community-driven security advisory feed for ClawSec",
              advisories: (($advisories[0] // []) | sort_by(.published) | reverse)
            }' > tmp/updated_feed.json
          fi

          # Validate JSON
          if jq empty tmp/updated_feed.json 2>/dev/null; then
            echo "Feed JSON is valid"
            mv tmp/updated_feed.json "$FEED_PATH"

            # Also update the skill feed
            mkdir -p "$(dirname "$SKILL_FEED_PATH")"
            cp "$FEED_PATH" "$SKILL_FEED_PATH"
            mkdir -p "$(dirname "$SUITE_FEED_PATH")"
            cp "$FEED_PATH" "$SUITE_FEED_PATH"

            echo "=== Updated feeds ==="
            echo "Main feed: $FEED_PATH"
            echo "Skill feed: $SKILL_FEED_PATH"
            echo "Suite feed: $SUITE_FEED_PATH"
            jq '.advisories | length' "$FEED_PATH"
          else
            echo "Error: Generated invalid JSON"
            exit 1
          fi

      - name: Poll GHSA without CVE and consolidate feed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALLOW_LARGE_REBUILD_DROP: ${{ inputs.allow_large_rebuild_drop || false }}
        run: |
          set -euo pipefail
          GHSA_DROP_ARGS=()
          if [ "$ALLOW_LARGE_REBUILD_DROP" = "true" ]; then
            GHSA_DROP_ARGS+=(--allow-large-drop)
          fi
          node scripts/ghsa-without-cve-feed.mjs \
            --output "$GHSA_FEED_PATH" \
            --consolidated-feed "$FEED_PATH" \
            --existing-feed "$GHSA_FEED_PATH" \
            --nvd-feed "$FEED_PATH" \
            --rejected-cve-ids "tmp/rejected_cve_ids.json" \
            --stale-after-days 60 \
            "${GHSA_DROP_ARGS[@]}"

          mkdir -p "$(dirname "$SKILL_FEED_PATH")"
          cp "$FEED_PATH" "$SKILL_FEED_PATH"
          mkdir -p "$(dirname "$SUITE_FEED_PATH")"
          cp "$FEED_PATH" "$SUITE_FEED_PATH"

          node scripts/ci/validate_advisory_feed.mjs "$FEED_PATH"

      - name: Verify advisory consumer releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/verify_advisory_consumer_releases.mjs "$FEED_PATH"

      - name: Detect advisory feed changes
        id: feed_changes
        env:
          STEPS_TRANSFORM_OUTPUTS_NVD_REBUILT_COUNT: ${{ steps.transform.outputs.nvd_rebuilt_count }}
          STEPS_TRANSFORM_OUTPUTS_NVD_NEW_TO_FEED_COUNT: ${{ steps.transform.outputs.nvd_new_to_feed_count }}
          STEPS_NVD_COUNTS_OUTPUTS_NVD_UPDATED_COUNT: ${{ steps.nvd_counts.outputs.nvd_updated_count }}
          STEPS_UPDATES_OUTPUTS_NVD_RETRACTED_COUNT: ${{ steps.updates.outputs.nvd_retracted_count }}
        run: |
          set -euo pipefail

          NVD_CHANGED=false
          GHSA_CHANGED=false
          AGENT_CHANGED=false
          GHSA_ACTIVE_COUNT="$(
            jq '[.advisories[]? | select((.id // "") | startswith("GHSA-")) | select(.status == "active")] | length' "$FEED_PATH"
          )"
          GHSA_ADDED_COUNT="$(
            jq --slurpfile existing tmp/existing_ids_from_feed.json '
              [.advisories[]? |
                select((.id // "") | startswith("GHSA-")) |
                select(.status == "active") |
                select(.id as $id | (($existing[0] // []) | index($id) | not))
              ] | length
            ' "$FEED_PATH"
          )"

          if [ "${STEPS_TRANSFORM_OUTPUTS_NVD_REBUILT_COUNT}" != "0" ] || [ "${STEPS_TRANSFORM_OUTPUTS_NVD_NEW_TO_FEED_COUNT}" != "0" ] || [ "${STEPS_NVD_COUNTS_OUTPUTS_NVD_UPDATED_COUNT}" != "0" ] || [ "${STEPS_UPDATES_OUTPUTS_NVD_RETRACTED_COUNT}" != "0" ]; then
            NVD_CHANGED=true
          fi

          if ! git diff --quiet -- "$GHSA_FEED_PATH" || [ ! -f "$GHSA_FEED_SIG_PATH" ]; then
            GHSA_CHANGED=true
          fi

          if ! git diff --quiet -- "$FEED_PATH" "$SKILL_FEED_PATH" "$SUITE_FEED_PATH" || [ ! -f "$FEED_SIG_PATH" ] || [ ! -f "$SKILL_FEED_SIG_PATH" ] || [ ! -f "$SUITE_FEED_SIG_PATH" ]; then
            AGENT_CHANGED=true
          fi

          echo "nvd_changed=$NVD_CHANGED" >> "$GITHUB_OUTPUT"
          echo "ghsa_changed=$GHSA_CHANGED" >> "$GITHUB_OUTPUT"
          echo "agent_changed=$AGENT_CHANGED" >> "$GITHUB_OUTPUT"
          echo "ghsa_active_count=$GHSA_ACTIVE_COUNT" >> "$GITHUB_OUTPUT"
          echo "ghsa_added_to_consolidated_count=$GHSA_ADDED_COUNT" >> "$GITHUB_OUTPUT"

          if [ "$GHSA_CHANGED" = "true" ] || [ "$AGENT_CHANGED" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard dependency manifests from NVD updates
        if: steps.feed_changes.outputs.changed == 'true'
        run: |
          set -euo pipefail

          BLOCKED_FILES=()
          for file in package.json package-lock.json npm-shrinkwrap.json; do
            if ! git diff --quiet -- "$file"; then
              BLOCKED_FILES+=("$file")
            fi
          done

          if [ "${#BLOCKED_FILES[@]}" -gt 0 ]; then
            echo "::error::NVD workflow must not modify dependency manifests: ${BLOCKED_FILES[*]}"
            git --no-pager diff -- "${BLOCKED_FILES[@]}" || true
            exit 1
          fi

      - name: Validate GHSA source feed before signing
        if: steps.feed_changes.outputs.ghsa_changed == 'true'
        run: node scripts/ci/validate_advisory_feed.mjs "$GHSA_FEED_PATH"

      - name: Sign GHSA feed and verify
        if: steps.feed_changes.outputs.ghsa_changed == 'true'
        uses: $/.github/actions/sign-and-verify
        with:
          private_key: ${{ secrets.CLAWSEC_SIGNING_PRIVATE_KEY }}
          private_key_passphrase: ${{ secrets.CLAWSEC_SIGNING_PRIVATE_KEY_PASSPHRASE }}
          input_file: ${{ env.GHSA_FEED_PATH }}
          signature_file: ${{ env.GHSA_FEED_SIG_PATH }}

      - name: Sign advisory feed and verify
        if: steps.feed_changes.outputs.agent_changed == 'true'
        uses: $/.github/actions/sign-and-verify
        with:
          private_key: ${{ secrets.CLAWSEC_SIGNING_PRIVATE_KEY }}
          private_key_passphrase: ${{ secrets.CLAWSEC_SIGNING_PRIVATE_KEY_PASSPHRASE }}
          input_file: ${{ env.FEED_PATH }}
          signature_file: ${{ env.FEED_SIG_PATH }}
          verify_files: |
            ${{ env.FEED_PATH }}
            ${{ env.SKILL_FEED_PATH }}
            ${{ env.SUITE_FEED_PATH }}

      - name: Sync advisory signature to skill feeds
        if: steps.feed_changes.outputs.agent_changed == 'true'
        run: |
          cp "$FEED_SIG_PATH" "$SKILL_FEED_SIG_PATH"
          cp "$FEED_SIG_PATH" "$SUITE_FEED_SIG_PATH"

      - name: Clean workspace for PR
        if: steps.feed_changes.outputs.changed == 'true'
        run: |
          # Reset any unintended changes, keep only feed files
          git checkout -- .github/ 2>/dev/null || true
          git clean -fd .github/ 2>/dev/null || true

      - name: Upsert NVD advisory PR
        if: steps.feed_changes.outputs.changed == 'true'
        id: upsert-pr
        env:
          GH_TOKEN: ${{ github.token }}
          STEPS_DATES_OUTPUTS_START_DATE: ${{ steps.dates.outputs.start_date }}
          STEPS_DATES_OUTPUTS_END_DATE: ${{ steps.dates.outputs.end_date }}
          STEPS_PROCESS_OUTPUTS_NVD_FILTERED_COUNT: ${{ steps.process.outputs.nvd_filtered_count }}
          STEPS_TRANSFORM_OUTPUTS_NVD_REBUILT_COUNT: ${{ steps.transform.outputs.nvd_rebuilt_count }}
          STEPS_TRANSFORM_OUTPUTS_NVD_NEW_TO_FEED_COUNT: ${{ steps.transform.outputs.nvd_new_to_feed_count }}
          STEPS_NVD_COUNTS_OUTPUTS_NVD_UPDATED_COUNT: ${{ steps.nvd_counts.outputs.nvd_updated_count }}
          STEPS_UPDATES_OUTPUTS_NVD_RETRACTED_COUNT: ${{ steps.updates.outputs.nvd_retracted_count }}
          STEPS_FEED_CHANGES_OUTPUTS_GHSA_ADDED_TO_CONSOLIDATED_COUNT: ${{ steps.feed_changes.outputs.ghsa_added_to_consolidated_count }}
          STEPS_FEED_CHANGES_OUTPUTS_GHSA_CHANGED: ${{ steps.feed_changes.outputs.ghsa_changed }}
          STEPS_FEED_CHANGES_OUTPUTS_AGENT_CHANGED: ${{ steps.feed_changes.outputs.agent_changed }}
        run: |
          set -euo pipefail

          BRANCH_PREFIX="automated/nvd-cve-update"
          PR_COMMENT="Superseded by newer automated NVD advisory update."
          TITLE="chore: update NVD/GHSA advisories - ${STEPS_TRANSFORM_OUTPUTS_NVD_NEW_TO_FEED_COUNT} NVD new, ${STEPS_NVD_COUNTS_OUTPUTS_NVD_UPDATED_COUNT} NVD updated, ${STEPS_UPDATES_OUTPUTS_NVD_RETRACTED_COUNT} NVD retracted, ${STEPS_FEED_CHANGES_OUTPUTS_GHSA_ADDED_TO_CONSOLIDATED_COUNT} GHSA active added"
          COMMIT_SUBJECT="$TITLE"
          # printf, not $'...': ANSI-C quoting does not expand parameters.
          COMMIT_BODY="$(printf 'Automated update from NVD CVE and GHSA advisory feeds.\nProtected components: %s\nPoll window: %s to %s' \
            "$PROTECTED_COMPONENTS" "$STEPS_DATES_OUTPUTS_START_DATE" "$STEPS_DATES_OUTPUTS_END_DATE")"

          GHSA_TOTAL="$(jq '.advisories | length' "$GHSA_FEED_PATH")"
          GHSA_ACTIVE="$(jq '[.advisories[] | select(.status == "active")] | length' "$GHSA_FEED_PATH")"
          GHSA_MATURED="$(jq '[.advisories[] | select(.status == "matured")] | length' "$GHSA_FEED_PATH")"
          GHSA_STALE="$(jq '[.advisories[] | select(.status == "stale")] | length' "$GHSA_FEED_PATH")"

          if [ "${{ inputs.force_full_scan }}" = "true" ]; then
            MODE="full-rebuild (ignore feed state)"
          else
            MODE="delta (incremental)"
          fi

          BODY_FILE="$(mktemp)"
          cat > "$BODY_FILE" <<EOF
          ## Summary
          Automated update from NVD CVE and GHSA advisory feeds.

          - **Mode:** ${MODE}
          - **Filtered NVD CVEs:** ${STEPS_PROCESS_OUTPUTS_NVD_FILTERED_COUNT}
          - **Rebuilt NVD advisories:** ${STEPS_TRANSFORM_OUTPUTS_NVD_REBUILT_COUNT}
          - **Net-new NVD advisories:** ${STEPS_TRANSFORM_OUTPUTS_NVD_NEW_TO_FEED_COUNT}
          - **Updated NVD advisories:** ${STEPS_NVD_COUNTS_OUTPUTS_NVD_UPDATED_COUNT}
          - **Retracted NVD advisories:** ${STEPS_UPDATES_OUTPUTS_NVD_RETRACTED_COUNT}
          - **GHSA active advisories added to consolidated feed:** ${STEPS_FEED_CHANGES_OUTPUTS_GHSA_ADDED_TO_CONSOLIDATED_COUNT}
          - **GHSA source feed changed:** ${STEPS_FEED_CHANGES_OUTPUTS_GHSA_CHANGED}
          - **Consolidated agent feed changed:** ${STEPS_FEED_CHANGES_OUTPUTS_AGENT_CHANGED}
          - **GHSA provisional advisories:** ${GHSA_TOTAL} total (${GHSA_ACTIVE} active, ${GHSA_MATURED} matured, ${GHSA_STALE} stale)
          - **Poll window:** ${STEPS_DATES_OUTPUTS_START_DATE} → ${STEPS_DATES_OUTPUTS_END_DATE}
          - **Protected components:** ${PROTECTED_COMPONENTS}

          ---
          *This PR was automatically generated by the NVD CVE polling workflow with GHSA consolidation.*
          EOF

          PR_LIST_JSON="$(
            gh api --paginate "repos/${{ github.repository }}/pulls?state=open&base=main&per_page=100" \
              --jq '.[] | {number, headRefName: .head.ref, url: .html_url, updatedAt: .updated_at}' \
            | jq -s '.'
          )"

          mapfile -t MATCHING_OPEN_PRS < <(
            echo "$PR_LIST_JSON" | jq -r --arg prefix "$BRANCH_PREFIX" '
              map(select(.headRefName | startswith($prefix)))
              | sort_by(.updatedAt)
              | reverse
              | .[]
              | @base64
            '
          )

          TARGET_BRANCH="$BRANCH_PREFIX"
          TARGET_PR_NUMBER=""
          TARGET_PR_URL=""

          if [ "${#MATCHING_OPEN_PRS[@]}" -gt 0 ]; then
            PRIMARY_JSON="$(echo "${MATCHING_OPEN_PRS[0]}" | base64 --decode)"
            TARGET_BRANCH="$(echo "$PRIMARY_JSON" | jq -r '.headRefName')"
            TARGET_PR_NUMBER="$(echo "$PRIMARY_JSON" | jq -r '.number')"
            TARGET_PR_URL="$(echo "$PRIMARY_JSON" | jq -r '.url')"

            if [ "${#MATCHING_OPEN_PRS[@]}" -gt 1 ]; then
              echo "Found multiple open NVD advisory PRs. Closing duplicates."
              for encoded_pr in "${MATCHING_OPEN_PRS[@]:1}"; do
                pr_json="$(echo "$encoded_pr" | base64 --decode)"
                pr_number="$(echo "$pr_json" | jq -r '.number')"
                gh pr close "$pr_number" --delete-branch --comment "$PR_COMMENT"
              done
            fi
          fi

          echo "Using target branch: $TARGET_BRANCH"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout -B "$TARGET_BRANCH" origin/main

          git add "$FEED_PATH" "$FEED_SIG_PATH" "$GHSA_FEED_PATH" "$GHSA_FEED_SIG_PATH" "$SKILL_FEED_PATH" "$SKILL_FEED_SIG_PATH" "$SUITE_FEED_PATH" "$SUITE_FEED_SIG_PATH"
          if git diff --cached --quiet; then
            echo "::error::Expected advisory feed changes but none were staged."
            exit 1
          fi

          git commit -m "$COMMIT_SUBJECT" -m "$COMMIT_BODY"
          git push --force origin "$TARGET_BRANCH"

          if [ -n "$TARGET_PR_NUMBER" ]; then
            gh pr edit "$TARGET_PR_NUMBER" --title "$TITLE" --body-file "$BODY_FILE"
          else
            TARGET_PR_URL="$(gh pr create --base main --head "$TARGET_BRANCH" --title "$TITLE" --body-file "$BODY_FILE")"
            TARGET_PR_NUMBER="$(basename "$TARGET_PR_URL")"
          fi

          if [ -z "$TARGET_PR_URL" ]; then
            TARGET_PR_URL="$(gh pr view "$TARGET_PR_NUMBER" --json url --jq '.url')"
          fi

          echo "pull-request-number=$TARGET_PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "pull-request-url=$TARGET_PR_URL" >> "$GITHUB_OUTPUT"
          echo "pull-request-branch=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Run CodeQL on generated PR branch
        if: steps.upsert-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          STEPS_UPSERT_PR_OUTPUTS_PULL_REQUEST_BRANCH: ${{ steps.upsert-pr.outputs.pull-request-branch }}
        run: |
          set -euo pipefail

          BRANCH="${STEPS_UPSERT_PR_OUTPUTS_PULL_REQUEST_BRANCH}"
          if [ -z "$BRANCH" ]; then
            echo "::error::Missing pull-request-branch output from upsert-pr step"
            exit 1
          fi

          EXPECTED_HEAD_SHA="$(git rev-parse HEAD)"
          DISPATCHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          echo "Dispatching CodeQL for branch: $BRANCH (head: $EXPECTED_HEAD_SHA, dispatched_at: $DISPATCHED_AT)"
          gh workflow run codeql.yml --ref "$BRANCH"

          RUN_ID=""
          for _ in $(seq 1 30); do
            RUN_ID=$(gh run list \
              --workflow "CodeQL" \
              --branch "$BRANCH" \
              --event workflow_dispatch \
              --limit 50 \
              --json databaseId,createdAt,headSha \
              | jq -r --arg since "$DISPATCHED_AT" --arg sha "$EXPECTED_HEAD_SHA" '
                map(select(.createdAt >= $since and .headSha == $sha))
                | sort_by(.createdAt)
                | last
                | .databaseId // empty')
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$RUN_ID" ]; then
            echo "::error::Unable to locate dispatched CodeQL run for branch $BRANCH after $DISPATCHED_AT (head: $EXPECTED_HEAD_SHA)"
            gh run list \
              --workflow "CodeQL" \
              --branch "$BRANCH" \
              --event workflow_dispatch \
              --limit 5 \
              --json databaseId,createdAt,headSha,status,conclusion || true
            exit 1
          fi

          echo "Waiting for CodeQL run id: $RUN_ID"
          gh run watch "$RUN_ID" --exit-status

      - name: Summary
        env:
          STEPS_DATES_OUTPUTS_START_DATE: ${{ steps.dates.outputs.start_date }}
          STEPS_DATES_OUTPUTS_END_DATE: ${{ steps.dates.outputs.end_date }}
          STEPS_PROCESS_OUTPUTS_NVD_FILTERED_COUNT: ${{ steps.process.outputs.nvd_filtered_count }}
          STEPS_TRANSFORM_OUTPUTS_NVD_REBUILT_COUNT: ${{ steps.transform.outputs.nvd_rebuilt_count }}
          STEPS_TRANSFORM_OUTPUTS_NVD_NEW_TO_FEED_COUNT: ${{ steps.transform.outputs.nvd_new_to_feed_count }}
          STEPS_NVD_COUNTS_OUTPUTS_NVD_UPDATED_COUNT: ${{ steps.nvd_counts.outputs.nvd_updated_count }}
          STEPS_UPDATES_OUTPUTS_NVD_RETRACTED_COUNT: ${{ steps.updates.outputs.nvd_retracted_count }}
          STEPS_FEED_CHANGES_OUTPUTS_GHSA_ADDED_TO_CONSOLIDATED_COUNT: ${{ steps.feed_changes.outputs.ghsa_added_to_consolidated_count }}
          STEPS_FEED_CHANGES_OUTPUTS_GHSA_CHANGED: ${{ steps.feed_changes.outputs.ghsa_changed }}
          STEPS_FEED_CHANGES_OUTPUTS_AGENT_CHANGED: ${{ steps.feed_changes.outputs.agent_changed }}
          STEPS_FEED_CHANGES_OUTPUTS_CHANGED: ${{ steps.feed_changes.outputs.changed }}
          STEPS_UPSERT_PR_OUTPUTS_PULL_REQUEST_URL: ${{ steps.upsert-pr.outputs.pull-request-url }}
        run: |
          if [ "${{ inputs.force_full_scan }}" = "true" ]; then
            MODE="full-rebuild (ignore feed state)"
          else
            MODE="delta (incremental)"
          fi

          echo "## NVD CVE Poll Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Mode | $MODE |" >> $GITHUB_STEP_SUMMARY
          echo "| Poll Window | ${STEPS_DATES_OUTPUTS_START_DATE} → ${STEPS_DATES_OUTPUTS_END_DATE} |" >> $GITHUB_STEP_SUMMARY
          echo "| Protected components | $PROTECTED_COMPONENTS |" >> $GITHUB_STEP_SUMMARY
          echo "| NVD CVEs Found (filtered) | ${STEPS_PROCESS_OUTPUTS_NVD_FILTERED_COUNT} |" >> $GITHUB_STEP_SUMMARY
          echo "| NVD Advisories Rebuilt | ${STEPS_TRANSFORM_OUTPUTS_NVD_REBUILT_COUNT} |" >> $GITHUB_STEP_SUMMARY
          echo "| Net-new NVD Advisories | ${STEPS_TRANSFORM_OUTPUTS_NVD_NEW_TO_FEED_COUNT} |" >> $GITHUB_STEP_SUMMARY
          echo "| Updated NVD Advisories | ${STEPS_NVD_COUNTS_OUTPUTS_NVD_UPDATED_COUNT} |" >> $GITHUB_STEP_SUMMARY
          echo "| Retracted NVD Advisories | ${STEPS_UPDATES_OUTPUTS_NVD_RETRACTED_COUNT} |" >> $GITHUB_STEP_SUMMARY
          echo "| GHSA Active Added | ${STEPS_FEED_CHANGES_OUTPUTS_GHSA_ADDED_TO_CONSOLIDATED_COUNT} |" >> $GITHUB_STEP_SUMMARY
          echo "| GHSA source feed changed | ${STEPS_FEED_CHANGES_OUTPUTS_GHSA_CHANGED} |" >> $GITHUB_STEP_SUMMARY
          echo "| Consolidated agent feed changed | ${STEPS_FEED_CHANGES_OUTPUTS_AGENT_CHANGED} |" >> $GITHUB_STEP_SUMMARY
          echo "| GHSA provisional advisories | $(jq '.advisories | length' "$GHSA_FEED_PATH") |" >> $GITHUB_STEP_SUMMARY

          if [ "${STEPS_TRANSFORM_OUTPUTS_NVD_NEW_TO_FEED_COUNT}" != "0" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Net-new NVD Advisories" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            jq -r '.[] | "- **\(.id)** (\(.severity)): \(.title)"' tmp/net_new_advisories.json >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${STEPS_NVD_COUNTS_OUTPUTS_NVD_UPDATED_COUNT}" != "0" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Updated NVD Advisories" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            jq -r '.[] | "- **\(.id)**: \(.changes | join(", "))"' tmp/updated_advisories.json >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${STEPS_UPDATES_OUTPUTS_NVD_RETRACTED_COUNT}" != "0" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Retracted NVD Advisories" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            jq -r '.[] | "- **\(.)**: NVD no longer provides an allowlisted product with explicit affected-version scope"' tmp/retracted_advisory_ids.json >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${STEPS_FEED_CHANGES_OUTPUTS_CHANGED}" = "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🔀 Upserted PR: ${STEPS_UPSERT_PR_OUTPUTS_PULL_REQUEST_URL}" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ No new or updated NVD CVEs or GHSA changes found." >> $GITHUB_STEP_SUMMARY
          fi
